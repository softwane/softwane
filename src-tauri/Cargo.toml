[package]
name = "erode-app"
version = "0.1.0"
description = "Ambient progressive rest reminder desktop app"
authors = ["r"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "erode_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", features = [] }
thiserror = "2"
